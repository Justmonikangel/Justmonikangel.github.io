<!--
  ============================================================
  SmartSplit · cross-link snippet for the Netlify "Smart Split MVP"
  ============================================================

  Paste the markup block (between BEGIN/END below) into the home view
  of your Smart Split MVP — most likely renderHome() inside
  src/templates.mjs, or wherever public/index.html lives.

  It renders a card that links out to your teammate's consumer-side
  SmartSplit demo (already deployed at
  https://justmonikangel.github.io/smartsplit/).

  Goal: from the Netlify home, audience can click into the consumer
  demo. The friend's app links back to Cyster today and will link back
  to your Netlify URL as soon as you share it.

  All styles are scoped under .cd-* so they won't collide with your
  existing CSS. Drop the <style> block once near the top of <head>,
  or move it into public/styles.css.
-->


<!-- BEGIN: paste from here ============================================ -->
<style>
.cd-card {
  display: block;
  max-width: 480px;
  margin: 32px auto;
  padding: 22px 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #fff5e6 0%, #ffe7ee 100%);
  border: 1px solid rgba(31, 29, 44, 0.08);
  color: #1f1d2c;
  text-decoration: none;
  box-shadow: 0 6px 24px rgba(31, 29, 44, 0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.cd-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(31, 29, 44, 0.12);
}
.cd-eyebrow {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #ff6b8a;
  font-weight: 600;
}
.cd-title {
  margin: 6px 0 6px;
  font-size: 20px;
  font-weight: 700;
}
.cd-sub {
  margin: 0;
  color: #5a5667;
  font-size: 14px;
  line-height: 1.5;
}
.cd-arrow {
  display: inline-block;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 600;
  color: #1a8a85;
}
.cd-card:hover .cd-arrow { color: #ff6b8a; }
</style>

<a class="cd-card"
   href="https://justmonikangel.github.io/smartsplit/"
   target="_blank"
   rel="noopener">
  <div class="cd-eyebrow">Sister demo · consumer side</div>
  <h3 class="cd-title">SmartSplit — snap the receipt</h3>
  <p class="cd-sub">
    My teammate's half: photograph any restaurant receipt, OCR + LLM
    itemise it, tag who had what, settle to the cent. The merchant side
    you're on now closes the loop.
  </p>
  <span class="cd-arrow">Open the consumer demo →</span>
</a>
<!-- END: paste to here =============================================== -->
