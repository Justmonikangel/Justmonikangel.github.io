<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmartSplit · Split the cheque to the cent</title>
<meta name="description" content="One photo. Tag who had what. Settle in seconds. SmartSplit is a per-item × per-person split-the-bill app for trips, dinners, and households." />
<meta name="theme-color" content="#0a0a0a" />
<meta property="og:title" content="SmartSplit" />
<meta property="og:description" content="Split the cheque to the cent. Pin the memory to the place." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0a0a'/><text x='16' y='22' font-family='Inter,sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23fff'>S</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/smartsplit.css" />
</head>
<body data-route="boot">

<div class="app" id="app" aria-live="polite">
  <header class="topbar" id="topbar"></header>

  <nav class="progress" id="pitchStrip" aria-label="Progress" hidden>
    <a class="step" data-step="problem"  href="#problem"><span class="dot"></span><span class="lbl">01 / Start</span></a>
    <a class="step" data-step="capture"  href="#capture"><span class="dot"></span><span class="lbl">02 / Capture</span></a>
    <a class="step" data-step="squad"    href="#squad"><span class="dot"></span><span class="lbl">03 / Squad</span></a>
    <a class="step" data-step="allocate" href="#allocate"><span class="dot"></span><span class="lbl">04 / Allocate</span></a>
    <a class="step" data-step="settle"   href="#settle"><span class="dot"></span><span class="lbl">05 / Settle</span></a>
  </nav>

  <main class="view" id="view"></main>

  <div class="toast-slot" id="toast" aria-live="assertive"></div>
</div>

<!-- ===================== TEMPLATES ===================== -->

<template id="tpl-login">
  <section class="auth-shell" data-anim="rise">
    <div class="auth-mark">
      <span class="brand-mark">S</span>
      <span class="brand-wordmark">SmartSplit</span>
    </div>
    <p class="kicker">Sign in</p>
    <h1 class="display">Welcome back.</h1>
    <p class="lede">Sign in to access your splits, your squad, and your memory timeline.</p>

    <form class="auth-form" id="loginForm" autocomplete="off" novalidate>
      <label class="field">
        <span>Username</span>
        <input name="username" type="text" autocomplete="username" placeholder="monika" required minlength="2" maxlength="32" />
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="3" />
        <div class="auth-strength" id="authStrength" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </label>

      <button class="btn primary block" type="submit" id="loginSubmit">
        <span class="btn-label">Sign in</span>
        <span class="btn-spinner" aria-hidden="true"></span>
        <svg class="btn-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      </button>

      <p class="auth-status" id="authStatus" role="status"></p>
    </form>

    <div class="auth-alt">
      <button class="btn outline block" id="toSignup" type="button">Create account</button>
      <button class="btn quiet" id="loginGuest" type="button">Continue as guest →</button>
    </div>

    <p class="auth-hint">Demo · <code>monika</code> / <code>monika</code></p>
  </section>
</template>

<template id="tpl-signup">
  <section class="auth-shell" data-anim="rise">
    <div class="auth-mark">
      <span class="brand-mark">S</span>
      <span class="brand-wordmark">SmartSplit</span>
    </div>
    <p class="kicker">Create account</p>
    <h1 class="display">Pick a name.</h1>
    <p class="lede">Stored locally on your device with IndexedDB. No cloud, no email, no tracker.</p>

    <form class="auth-form" id="signupForm" autocomplete="off" novalidate>
      <label class="field">
        <span>Username</span>
        <input name="username" type="text" placeholder="aya" required minlength="2" maxlength="32" pattern="[A-Za-z0-9_\.\-]+" />
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" placeholder="At least 4 characters" required minlength="3" />
      </label>
      <label class="field">
        <span>Display name <small>optional</small></span>
        <input name="displayName" type="text" placeholder="What your friends call you" maxlength="32" />
      </label>

      <button class="btn primary block" type="submit" id="signupSubmit">
        <span class="btn-label">Create account</span>
        <span class="btn-spinner" aria-hidden="true"></span>
        <svg class="btn-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      </button>
      <p class="auth-status" id="authStatus" role="status"></p>
    </form>

    <button class="btn quiet" id="toLogin" type="button">← Back to sign in</button>
  </section>
</template>

<template id="tpl-problem">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">SmartSplit</p>
    <h1 class="display">Split the cheque to the cent. Pin the memory to the place.</h1>
    <p class="lede">One photo. Tag who had what. Settle in seconds — and keep the receipt as a shared timeline of where you've been.</p>

    <div class="cta-stack">
      <a class="btn primary block lg" href="#capture">Start a split <span class="btn-arrow">→</span></a>
      <a class="btn outline block" href="#scenarios">See how it works</a>
    </div>
  </section>

  <section class="prose" data-anim="slide-up" data-delay="80">
    <p class="kicker">Recent splits</p>
    <div class="history-wrap" id="historyWrap"></div>
  </section>

  <section class="prose stats" data-anim="slide-up" data-delay="160">
    <div class="stat-line"><span>Built for</span><strong>trips · households · dinners</strong></div>
    <div class="stat-line"><span>Stored in</span><strong>IndexedDB · on your device only</strong></div>
    <div class="stat-line"><span>Embed it</span><strong>&lt;smart-split&gt; web component</strong></div>
  </section>
</template>

<template id="tpl-scenarios">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">How it works</p>
    <h1 class="display">Three scenarios it handles natively.</h1>
    <p class="lede">Most apps assume everyone splits everything equally. SmartSplit doesn't. Tap an item, tag a person — the per-cent ledger updates.</p>
  </section>

  <div class="scenario-grid" id="scenarioGrid"></div>

  <a class="btn primary block lg" href="#capture" data-anim="slide-up" data-delay="160">Start a split <span class="btn-arrow">→</span></a>
</template>

<template id="tpl-capture">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">Capture</p>
    <h1 class="display">Take a photo.</h1>
    <p class="lede">OCR is on the roadmap. For the demo, four Australian sample receipts mirror what the parser would return.</p>

    <label class="upload-area" for="receiptFile">
      <input type="file" id="receiptFile" accept="image/*" capture="environment" hidden />
      <span class="upload-btn btn primary block lg">Take photo / upload</span>
      <span class="upload-hint">Or scroll for samples ↓</span>
    </label>
  </section>

  <section class="parsed-wrap" id="parsedWrap" hidden data-anim="rise">
    <div class="parsed-head">
      <p class="kicker"><span id="parsedTime">Parsed in 0ms</span> · Sample data</p>
      <h2 class="h2" id="parsedTitle">—</h2>
      <p class="parsed-place" id="parsedPlace">—</p>
    </div>
    <div class="parsed-items" id="parsedItems"></div>
    <div class="parsed-fee" id="parsedFee"></div>
    <a class="btn primary block lg" href="#squad">Looks right — pick the squad <span class="btn-arrow">→</span></a>
  </section>

  <div class="prose">
    <p class="kicker">Sample receipts</p>
  </div>
  <div class="receipt-gallery" id="receiptGallery"></div>
</template>

<template id="tpl-squad">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">Squad</p>
    <h1 class="display">Who shared this?</h1>
    <p class="lede">Per-item × per-person — not a flat average. Add the people involved.</p>
  </section>

  <div class="squad-list" id="squadList" data-anim="slide-up" data-delay="60"></div>

  <form class="add-person" id="addPerson" autocomplete="off">
    <input name="name" placeholder="Add a person" maxlength="24" required />
    <button class="btn outline" type="submit">Add</button>
  </form>

  <a class="btn primary block lg" id="toAllocate" href="#allocate">Allocate items <span class="btn-arrow">→</span></a>
</template>

<template id="tpl-allocate">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">Allocate</p>
    <h1 class="display">Tap who had each item.</h1>
    <p class="lede">Untag a person to skip them. Untagged items are split equally across the whole squad.</p>
  </section>

  <div class="item-list" id="allocateList" data-anim="slide-up" data-delay="60"></div>

  <a class="btn primary block lg" href="#settle">Settle <span class="btn-arrow">→</span></a>
</template>

<template id="tpl-settle">
  <section class="prose" data-anim="slide-up">
    <p class="kicker">Settle</p>
    <h1 class="display">Everyone's share.</h1>
    <p class="lede">Tag a place — it'll appear on your timeline.</p>
  </section>

  <section class="card" data-anim="rise">
    <label class="field">
      <span>Place</span>
      <input id="placeName" placeholder="e.g. Chin Chin, Melbourne" />
    </label>
  </section>

  <section class="totals-card" id="totalsCard" data-anim="rise" data-delay="40"></section>

  <section data-anim="rise" data-delay="80">
    <p class="kicker">Each person owes</p>
    <div class="owed-list" id="owedList"></div>
  </section>

  <button class="btn primary block lg" id="settleBtn" data-anim="rise" data-delay="120">
    <span class="btn-label">Settle</span>
    <svg class="btn-check" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
  </button>
</template>

<template id="tpl-empty">
  <div class="empty">
    <p id="emptyMsg">Nothing here yet.</p>
    <a class="btn outline" href="#capture">Start a split</a>
  </div>
</template>

<template id="tpl-history-empty">
  <div class="empty empty--inline">
    <p>No splits yet — the first photo creates your first memory.</p>
  </div>
</template>

<script src="js/db.js"></script>
<script src="js/samples.js"></script>
<script src="js/split.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
