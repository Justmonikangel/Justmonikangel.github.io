[project]
name = "bact-protein-search"
version = "0.1.0"
description = "ERAST-style bacterial protein homology search backend (ESM2 + FAISS + BLAST + Foldseek + RAST)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "biopython>=1.83",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.41",
    "faiss-cpu>=1.8",
    "fair-esm>=2.0.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
